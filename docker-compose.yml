version: '3.8'

services:
  livraria-tech:
    build: .
    container_name: livraria-tech
    restart: always
    ports:
      - "80:80"
      - "3000:3000"
    environment:
      - PORT=80
      - CACHE_DIR=/app/cache
      - NODE_ENV=production
      - PUBLIC_URL=${PUBLIC_URL:-https://livraria.mwtech.qzz.io}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash}
    volumes:
      - livraria_cache:/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  livraria_cache:
    driver: local
