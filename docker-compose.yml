version: '3.8'

services:
  livraria-tech:
    build: .
    container_name: livraria-tech
    restart: always
    ports:
      - "80:80"
      - "3000:3000"
    environment:
      - PORT=80
      - CACHE_DIR=/app/cache
      - NODE_ENV=production
    volumes:
      - livraria_cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  livraria_cache:
    driver: local
