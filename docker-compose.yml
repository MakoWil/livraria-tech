version: '3.8'

services:
  livraria-tech:
    build: .
    container_name: livraria-tech
    restart: always
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
