<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Livraria Tech — Biblioteca digital gratuita com livros de programação e tecnologia. Leia online em PDF e EPUB.">
  <meta name="theme-color" content="#4f6ef7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Livraria Tech — Biblioteca Digital</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css?v=1.3.1">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- ePub.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js"></script>

  <!-- Favicon (emoji-based) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
  <!-- ============================================
       HEADER
       ============================================ -->
  <header class="header">
    <div class="header-content">
      <!-- Logo -->
      <a href="#" class="logo" onclick="event.preventDefault(); location.reload();">
        <div class="logo-icon">📚</div>
        <div class="logo-text">Livraria<span>Tech</span></div>
      </a>

      <!-- Search -->
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Buscar livros..."
          autocomplete="off"
          aria-label="Buscar livros"
        >
      </div>

      <!-- Header Actions -->
      <div class="header-actions">
        <button class="btn-icon" id="theme-toggle" title="Alternar tema" aria-label="Alternar tema">🌙</button>
      </div>
    </div>
  </header>

  <!-- ============================================
       MAIN CONTENT — Book Dashboard
       ============================================ -->
  <main class="main">
    <div class="container">
      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stats-text" id="stats-count">Carregando...</div>
        <div class="stats-actions">
          <button class="favorites-filter-btn" id="favorites-filter-btn" onclick="App.toggleFavoritesFilter()" title="Filtrar favoritos" aria-label="Filtrar favoritos">
            ⭐ <span>Favoritos</span>
          </button>
          <div class="view-toggle">
            <button class="view-btn active" data-view="grid" title="Grade" aria-label="Visualização em grade">▦</button>
            <button class="view-btn" data-view="list" title="Lista" aria-label="Visualização em lista">☰</button>
          </div>
        </div>
      </div>

      <!-- Favorites Carousel Section (Featured / Recommended - Image 2 style) -->
      <section class="favorites-section" id="favorites-section" style="display: none;">
        <div class="favorites-section-header">
          <h2 class="favorites-section-title">⭐ Meus Favoritos</h2>
          <div class="carousel-nav">
            <button class="carousel-nav-btn" onclick="App.scrollFavorites(-340)" title="Anterior">‹</button>
            <button class="carousel-nav-btn" onclick="App.scrollFavorites(340)" title="Próximo">›</button>
          </div>
        </div>
        <div class="favorites-carousel" id="favorites-carousel">
          <!-- Dynamically populated favorite cards -->
        </div>
      </section>

      <!-- Section Title for All Books -->
      <div class="catalog-header" id="catalog-header" style="margin-bottom: 16px;">
        <h2 class="catalog-title" style="font-size: 1.1rem; font-weight: 700; color: var(--text-primary);">📚 Todos os Livros</h2>
      </div>

      <!-- Books Container -->
      <div id="books-container">
        <!-- Dynamic content -->
      </div>
    </div>
  </main>

  <!-- ============================================
       READER VIEW (fullscreen overlay)
       ============================================ -->
  <div class="reader-view" id="reader-view">
    <!-- Reader Header -->
    <div class="reader-header">
      <button class="reader-btn-icon" id="reader-close" title="Voltar" aria-label="Voltar à biblioteca">←</button>
      <div class="reader-title" id="reader-title">Carregando...</div>
      <button class="reader-btn" id="reader-bookmark-add" title="Adicionar marcador">📑 <span>Marcar</span></button>
      <button class="reader-btn" id="reader-bookmarks-toggle" title="Ver marcadores">🔖 <span>Marcadores</span></button>
      <button class="reader-btn-icon" id="reader-night" title="Modo noturno" aria-label="Alternar modo noturno">🌙</button>
      <button class="reader-btn-icon" id="font-decrease" title="Diminuir fonte/zoom" aria-label="Diminuir fonte/zoom">A-</button>
      <button class="reader-btn-icon" id="font-increase" title="Aumentar fonte/zoom" aria-label="Aumentar fonte/zoom">A+</button>
      <button class="reader-btn accent" id="reader-download" title="Download">📥 <span>Download</span></button>
    </div>

    <!-- Progress Bar -->
    <div class="reader-progress">
      <div class="reader-progress-bar" id="reader-progress-bar"></div>
    </div>

    <!-- Reader Content -->
    <div class="reader-content" id="reader-content">
      <!-- PDF or EPUB rendered here -->
    </div>

    <!-- Zoom Controls (floating, for PDF inside reader-view) -->
    <div class="zoom-controls" id="zoom-controls" style="display:none;">
      <button id="zoom-in" title="Aumentar zoom (Ctrl + Scroll ↑)" aria-label="Aumentar zoom">+</button>
      <span class="zoom-level" id="zoom-level">120%</span>
      <button id="zoom-out" title="Diminuir zoom (Ctrl + Scroll ↓)" aria-label="Diminuir zoom">−</button>
    </div>

    <!-- Bookmarks Panel (slide-in) -->
    <div class="bookmarks-panel" id="bookmarks-panel">
      <div class="bookmarks-header">
        <h3>📑 Marcadores</h3>
        <button class="reader-btn-icon" id="bookmarks-close" title="Fechar" style="width:28px;height:28px;font-size:14px;">✕</button>
      </div>
      <div class="bookmarks-list" id="bookmarks-list">
        <!-- Dynamic bookmarks -->
      </div>
    </div>
  </div>

  <!-- Bookmark Add Modal -->
  <div class="bookmark-modal" id="bookmark-modal">
    <div class="bookmark-modal-content">
      <h3>📑 Novo Marcador</h3>
      <input type="text" id="bookmark-name-input" placeholder="Nome do marcador" maxlength="100">
      <div class="bookmark-modal-actions">
        <button class="btn-cancel" id="bookmark-cancel">Cancelar</button>
        <button class="btn-save" id="bookmark-save">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Scripts -->
  <script src="js/utils.js?v=1.3.1"></script>
  <script src="js/reader.js?v=1.3.1"></script>
  <script src="js/app.js?v=1.3.1"></script>
</body>
</html>
